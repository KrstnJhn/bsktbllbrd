<!DOCTYPE html>
<html>
<head>
  <title>Viewer M</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #444;
      color: #fff;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-container {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 20px;
      gap: 0px;
    }

    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-timer {
      font-family: 'LCDMono', monospace;
      font-size: 17em;
      color: #fff;
      background-color: #ff8c00;
      padding: 10px 10px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 0px;
      width: 100%;
      max-width: 1000px;
    }

    .quarter-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .quarter-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background-color: #555;
      color: #fff;
      cursor: pointer;
      font-size: 2em;
    }

    .quarter-btn.active {
      background-color: #ff8c00;
      font-weight: bold;
    }

    .teams-container {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      flex: 1;
      gap: 10px;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .shot-clock-container {
      position: relative;
      bottom: auto;
      right: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex;
      background-color: #222;
      padding: 5px;
      border-radius: 10px;
      box-shadow: 0 4px 4px rgba(0,0,0,0.3);
    }

    .team-name {
      font-size: 2.5em;
      color: #ffff;
    }

    .team-score {
      font-family: 'LCDMono', monospace;
      font-size: 17em;
      color: #fff;
      background-color: #222;
      padding: 0px 50px;
      border-radius: 10px;
      min-width: 180px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .foul-indicator {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .foul-dot {
      width: 35px;
      height: 15px;
      border-radius: 20%;
      background-color: #555;
      border: 2px solid #777;
    }

    .foul-dot.active {
      background-color: #fbff00;
    }

    .shot-clock-label {
      font-size: 1.5em;
      color: #ddd;
      margin-bottom: 5px;
      text-align: center;
    }

    .shot-clock {
      font-family: 'LCDMono', monospace;
      font-size: 10em;
      color: #ffeb3b;
      background-color: #222;
      padding: 10px 25px;
      border-radius: 10px;
      text-align: center;
      min-width: 100px;
    }

    .shot-clock.warning {
      color: #ff0000;
      animation: pulse 0.5s infinite;
    }

    #connection-status {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      border-radius: 5px;
      z-index: 1000;
    }

    #winning-team-notification {
      position: fixed;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none; /* Hidden by default */
      z-index: 1000;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      .game-timer {
        font-size: 5em;
      }
      .team-name {
        font-size: 2em;
      }
      .team-score {
        font-size: 6em;
        padding: 15px 30px;
      }
    }

    @media (max-width: 480px) {
      .game-timer {
        font-size: 3em;
        padding: 8px 10px;
      }
      .team-name {
        font-size: 1.5em;
      }
      .team-score {
        font-size: 4em;
        padding: 10px 15px;
        min-width: auto;
      }
      .quarter-buttons {
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
      }
      .quarter-btn {
        font-size: 1.5em;
        padding: 8px 12px;
      }
      .shot-clock {
        font-size: 6em;
        padding: 8px 15px;
        min-width: 80px;
      }
      .shot-clock-label {
        font-size: 1.2em;
      }
    }

    @font-face {
      font-family: 'LCDMono';
      src: url('your-lcd-mono-font.woff2') format('woff2'),
           url('your-lcd-mono-font.woff') format('woff');
    }
  </style>
</head>
<body>
  <div class="header">'</div>
  <div class="main-container">
    <div class="timer-container">
      <div class="possession-arrows" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 10px;">
        <div class="possession-arrow" id="viewer-arrow-right" style="font-size: 15em; color: #ffffff;">◄</div>
        <div class="game-timer" id="viewer-timer">11:00</div>
        <div class="possession-arrow" id="viewer-arrow-left" style="font-size: 15em; color: #ffffff;">►</div>
      </div>
    </div>
    <div class="teams-container">
      <div class="team">
        <div class="team-name">AWAY</div>
        <div class="team-score" id="viewer-away-score">0</div>
        <div class="foul-indicator">
          <div class="foul-dot" id="viewer-away-foul-1"></div>
          <div class="foul-dot" id="viewer-away-foul-2"></div>
          <div class="foul-dot" id="viewer-away-foul-3"></div>
          <div class="foul-dot" id="viewer-away-foul-4"></div>
          <div class="foul-dot" id="viewer-away-foul-5"></div>
        </div>
      </div>
    <div>
      <div class="quarter-buttons">
        <button class="quarter-btn active" id="viewer-q1">1st</button>
        <button class="quarter-btn" id="viewer-q2">2nd</button>
        <button class="quarter-btn" id="viewer-q3">3rd</button>
        <button class="quarter-btn" id="viewer-q4">4th</button>
        <div class="dropdown" style="position: relative;">
          <button id="viewerOtDropdownBtn" class="quarter-btn" onclick="toggleViewerOtDropdown()">OT</button>
          <div id="viewerOtDropdown" class="dropdown-content" style="display:none; position:absolute; background-color:#555; border-radius: 5px; margin-top: 5px; z-index: 100;">
            <button class="quarter-btn" onclick="setViewerQuarter('OT')">OT</button>
            <button class="quarter-btn" onclick="setViewerQuarter('OT2')">OT2</button>
            <button class="quarter-btn" onclick="setViewerQuarter('OT3')">OT3</button>
            <button class="quarter-btn" onclick="setViewerQuarter('OT4')">OT4</button>
            <button class="quarter-btn" onclick="setViewerQuarter('OT5')">OT5</button>
          </div>
        </div>
      </div>
      <div class="shot-clock-container">
        <div class="shot-clock-label">SHOT CLOCK</div>
        <div class="shot-clock" id="viewer-shot-clock">24</div>
      </div>
    </div>
      <div class="team">
        <div class="team-name">HOME</div>
        <div class="team-score" id="viewer-home-score">0</div>
        <div class="foul-indicator">
          <div class="foul-dot" id="viewer-home-foul-1"></div>
          <div class="foul-dot" id="viewer-home-foul-2"></div>
          <div class="foul-dot" id="viewer-home-foul-3"></div>
          <div class="foul-dot" id="viewer-home-foul-4"></div>
          <div class="foul-dot" id="viewer-home-foul-5"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="winning-team-notification">Congratulation 
    <span id="winning-team-name"></span> with score: <span id="winning-team-score"></span>
  </div>

  <script>
    // Connection status element
    const connectionStatus = document.createElement('div');
    connectionStatus.id = 'connection-status';
    document.body.appendChild(connectionStatus);

    // Connection status display
    function showConnectionStatus(status) {
      const statusElement = document.getElementById('connection-status');
      if (status === 'connected') {
        statusElement.textContent = '✔';
        statusElement.style.color = 'white';
      } else {
        statusElement.textContent = '✖';
        statusElement.style.backgroundColor = '#F44336';
        statusElement.style.color = 'white';
      }
    }

    // Update display from localStorage with error handling
    function toggleViewerOtDropdown() {
      const dropdown = document.getElementById('viewerOtDropdown');
      dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }

    // Close dropdown if clicked outside
    window.addEventListener('click', function(event) {
      const dropdown = document.getElementById('viewerOtDropdown');
      const btn = document.getElementById('viewerOtDropdownBtn');
      if (!btn.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = 'none';
      }
    });

    function setViewerQuarter(quarter) {
      // This function is for manual selection in viewer, if needed
      // It can be extended to send commands back to sc.html if required
      updateViewerDisplay(quarter);
      document.getElementById('viewerOtDropdown').style.display = 'none';
    }

    function updateViewerDisplay() {
      try {
        const savedState = localStorage.getItem('basketballScoreboard');
        if (!savedState) {
          showConnectionStatus('disconnected');
          return;
        }
        const state = JSON.parse(savedState);
        showConnectionStatus('connected');
        
        // Update timer
        const minutes = Math.floor(state.gameTimeLeft / 60).toString().padStart(2, '0');
        const seconds = (state.gameTimeLeft % 60).toString().padStart(2, '0');
        document.getElementById('viewer-timer').textContent = `${minutes}:${seconds}`;
        
        // Update team names and scores
        document.querySelector('.team:nth-child(1) .team-name').textContent = state.awayTeamName || "AWAY";
        document.querySelector('.team:nth-child(3) .team-name').textContent = state.homeTeamName || "HOME";
        document.getElementById('viewer-away-score').textContent = state.awayScore || 0;
        document.getElementById('viewer-home-score').textContent = state.homeScore || 0;
        
        // Update quarter buttons
        const quarterButtons = ['viewer-q1', 'viewer-q2', 'viewer-q3', 'viewer-q4'];
        quarterButtons.forEach(btnId => {
          document.getElementById(btnId).classList.remove('active');
        });
        // Remove active from OT dropdown button
        const otBtn = document.getElementById('viewerOtDropdownBtn');
        otBtn.classList.remove('active');

        if (typeof state.currentQuarter === 'number' && state.currentQuarter >= 1 && state.currentQuarter <= 4) {
          const activeBtnId = `viewer-q${state.currentQuarter}`;
          document.getElementById(activeBtnId).classList.add('active');
          otBtn.textContent = 'OT';
        } else if (typeof state.currentQuarter === 'string' && state.currentQuarter.startsWith('OT')) {
          otBtn.classList.add('active');
          otBtn.textContent = state.currentQuarter;
        }

        // Update shot clock with warning state and visibility
        const shotClock = document.getElementById('viewer-shot-clock');
        const shotClockLabel = document.querySelector('.shot-clock-label');
        const shouldShowShotClock = state.shotTimeLeft <= state.gameTimeLeft;
        
        shotClock.textContent = state.shotTimeLeft.toString().padStart(2, '0');
        shotClock.classList.toggle('warning', state.shotTimeLeft <= 5 && state.shotTimeLeft > 0);
        shotClock.style.display = shouldShowShotClock ? '' : 'none';
        shotClockLabel.style.display = shouldShowShotClock ? '' : 'none';

        // Update possession arrows to match sc.html's values ('home'/'away')
        const rightArrow = document.getElementById('viewer-arrow-right');
        const leftArrow = document.getElementById('viewer-arrow-left');
        rightArrow.style.color = state.ballPosition === 'away' ? 'red' : '#7a7870';
        leftArrow.style.color = state.ballPosition === 'home' ? 'red' : '#7a7870';

        // Update foul indicators from array format
        if (Array.isArray(state.homeFouls)) {
          state.awayFouls.forEach((isFoul, index) => {
            const foulDot = document.getElementById(`viewer-away-foul-${index + 1}`);
            if (foulDot) foulDot.classList.toggle('active', isFoul);
          });
        }
        if (Array.isArray(state.homeFouls)) {
          state.homeFouls.forEach((isFoul, index) => {
            const foulDot = document.getElementById(`viewer-home-foul-${index + 1}`);
            if (foulDot) foulDot.classList.toggle('active', isFoul);
          });
        }

        // Check if the game time is over
        if (state.gameTimeLeft <= 0) {
          const awayScore = state.awayScore || 0;
          const homeScore = state.homeScore || 0;
          const winningTeamNotification = document.getElementById('winning-team-notification');
          const winningTeamName = document.getElementById('winning-team-name');
          const winningTeamScore = document.getElementById('winning-team-score');

          if (awayScore > homeScore) {
            winningTeamName.textContent = state.awayTeamName || "AWAY";
            winningTeamScore.textContent = awayScore;
            winningTeamNotification.style.display = 'block';
          } else if (homeScore > awayScore) {
            winningTeamName.textContent = state.homeTeamName || "HOME";
            winningTeamScore.textContent = homeScore;
            winningTeamNotification.style.display = 'block';
          } else {
            winningTeamNotification.style.display = 'none'; // Hide if it's a tie
          }
          return; // Exit the function to prevent further updates
        }
        
        // During game time, hide the winning team notification
        document.getElementById('winning-team-notification').style.display = 'none';
      } catch (error) {
        console.error('Display update error:', error);
        showConnectionStatus('disconnected');
      }
    }

    // Listen for storage changes with error handling
    window.addEventListener('storage', function(e) {
      try {
        if (e.key === 'basketballScoreboard') {
          updateViewerDisplay();
        }
      } catch (error) {
        console.error('Storage event error:', error);
        showConnectionStatus('disconnected');
      }
    });

    // Initial update
    updateViewerDisplay();
    
    // Enhanced update interval with error handling
    let updateInterval = setInterval(() => {
      try {
        updateViewerDisplay();
      } catch (error) {
        console.error('Update error:', error);
        showConnectionStatus('disconnected');
        clearInterval(updateInterval);
        // Attempt to restart after 5 seconds
        setTimeout(() => {
          updateInterval = setInterval(updateViewerDisplay, 1000);
        }, 5000);
      }
    }, 1000);
  </script>
</body>
</html>
